<div class="footer px-4 divide-y dark:bg-gray-100 dark:text-gray-800">
	<div class="container flex flex-col justify-between py-10 mx-auto space-y-8 lg:flex-row lg:space-y-0">
		<div class="lg:w-1/3">
			<a rel="noopener noreferrer" routerLink="/" class="flex justify-center space-x-3 lg:justify-start">
				<div class="flex items-center justify-center w-12 h-12 rounded-full">
          <img ngSrc="icons/Poké_Ball_icon.svg" width="256" height="256" priority="">
				</div>
				<h2 class="self-center text-5xl font-semibold">{{appName}}</h2>
			</a>
		</div>
		<div class="grid grid-cols-2 text-sm gap-x-3 gap-y-8 lg:w-2/3 sm:grid-cols-4">
      @for(item of footerItems; track $index){
        <div class="space-y-3">
          <h3 class="tracking-wide uppercase dark:text-gray-900">{{item.title}}</h3>
          <ul class="space-y-1">
            @for(link of item.links; track $index){
              <li>
                <a rel="noopener noreferrer" [routerLink]="link.url">{{link.name}}</a>
              </li>
            }
          </ul>
        </div>
      }
			<div class="space-y-3">
        <h3 class="tracking-wide uppercase dark:text-gray-900">Réseau sociaux</h3>
				<div class="flex justify-start space-x-3">
          @for(socialNetwork of socialNetworks; track $index){
            <a rel="noopener noreferrer" href="{{socialNetwork.link}}" target="_blank" aria-label="{{socialNetwork.name}}">
              <i class="{{socialNetwork.icon}}" style="font-size: 24px"></i>
            </a>
          }
				</div>
			</div>
		</div>
	</div>
	<div class="py-6 text-sm text-center dark:text-gray-600">© 2025 {{appName}}</div>
</div>
